name: Deploy Web

# Manual-only, mirroring deploy-admin.yml. The public site is deployed from the
# Vercel dashboard's Git integration in normal operation (SITE-1.1 runbook);
# this workflow exists for a deliberate re-deploy from a known commit.
on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing after checkout needs the repository token; keep it out of .git/config.
          persist-credentials: false

      # [SEC-AUDIT 13 Nov 2026 · F18] No repository install in this job: `vercel --prod` (no --prebuilt) builds on
      # Vercel, so nothing here needs the monorepo's node_modules, and no dependency's install script (nor a
      # restored pnpm cache) ever runs on the runner that later receives the deploy token.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The site must never ship with a company detail unfilled — the build
      # already refuses, but failing here names the reason before Vercel spends
      # a build minute on it. [SITE-1.1 Part 3]
      - name: Company details are filled
        run: |
          if grep -qE '\{\{[A-Z_]+\}\}' apps/web/src/site.config.ts; then
            echo "::error::apps/web/src/site.config.ts still contains unfilled {{TOKENS}} — see SITE-1.1 Part 3"
            grep -nE '\{\{[A-Z_]+\}\}' apps/web/src/site.config.ts
            exit 1
          fi

      # [AUD-1 row 303] The deploy tool is an EXACT version (never "latest" from
      # the registry at deploy time), installed in its own step with install
      # scripts off: no third-party install code ever runs while the deploy
      # token is in the environment. Bump the version deliberately, in a PR.
      # [SEC-AUDIT 13 Nov 2026 · F18] ...and so is every one of its dependencies: `npm ci` installs exactly the
      # reviewed .github/vercel-cli lockfile (integrity-checked), from the public registry named on the line.
      - name: Install the Vercel CLI (exact version)
        run: |
          mkdir -p "$RUNNER_TEMP/vercel-cli"
          cp .github/vercel-cli/package.json .github/vercel-cli/package-lock.json .github/vercel-cli/.npmrc "$RUNNER_TEMP/vercel-cli/"
          npm ci --prefix "$RUNNER_TEMP/vercel-cli" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Deploy to Vercel
        # The CLI reads VERCEL_TOKEN from the environment when no token flag
        # is given (its own lookup). The token is never an argument:
        # argv is visible to every process on the runner; env vars are not.
        run: |
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" --prod --scope="$VERCEL_ORG_ID" --yes
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB }}
